[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-lab"
version = "0.12.0"
description = "Headless reusable machine-learning operations engine for PAH and standalone use"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
flask = ["Flask>=3.0"]
neural = ["torch>=2.0"]
energy = ["torch>=2.0"]
experimental-neural = ["torch>=2.0"]

[project.scripts]
ml-lab = "ml_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
